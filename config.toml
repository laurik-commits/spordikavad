# spordikavad.ee seadistus

[site]
days_ahead = 14
# Lehe avalik aadress (kanoonilised lingid, sitemap). Muuda, kui spordikavad.ee domeen on seadistatud.
base_url = "https://laurik-commits.github.io/spordikavad/"
# Kontakt jaluses. Ajutiselt GitHubi issue'd; kui info@spordikavad.ee postkast töötab,
# muuda: contact_url = "mailto:info@spordikavad.ee"
contact_url = "https://github.com/laurik-commits/spordikavad/issues"
# Cloudflare Web Analytics (küpsisevaba). Vaikimisi välja lülitatud.
analytics_enabled = false
analytics_token = ""

[http]
# Kontaktaadress lisatakse User-Agenti, et allika omanik saaks vajadusel ühendust võtta.
# Ajutiselt GitHubi issue'de leht; hiljem "info@spordikavad.ee", kui postkast töötab.
contact = "https://github.com/laurik-commits/spordikavad/issues"
# Kui domeen spordikavad.ee on kasutusel, vaheta URL siin ära.
user_agent = "spordikavad-bot/0.1 (+https://laurik-commits.github.io/spordikavad/)"
delay = 3.0       # sekundit päringute vahel samale saidile
timeout = 20.0
retries = 3

[http.host_delays]
"jalgpall.ee" = 5.0   # robots.txt: Crawl-Delay: 5

# Väline link ilma andmete kogumiseta (vt SOURCES.md, korvpall)
[[external_link]]
sport = "korvpall"
url = "https://www.basket.ee/et/ajakava-ja-tulemused?action=schedule"

# Allikad. Hooaja kuupäevad on ligikaudsed (vt SOURCES.md). Hooaja sees tähendab
# 0 mängu viga, väljaspool hooaega mitte.

[[source]]
name = "jalgpall_ejl"
sport = "jalgpall"
league = "Jalgpall (EJL)"
enabled = true
seasons = [["2027-03-01", "2027-11-30"]]
# jalgpall.ee liigade ID-d (/voistlused/<id>/liigad/calendar?season=<aasta>)
competitions = [
  { id = 52, league = "Premium liiga" },
  { id = 63, league = "Naiste meistriliiga" },
]

[[source]]
name = "saalijalgpall_ejl"
sport = "saalijalgpall"
league = "Saalijalgpall (EJL)"
enabled = true
seasons = [["2026-10-01", "2027-04-15"]]
# jalgpall.ee saalijalgpalli liigad; playoffid (id 187) lisa siia, kui need on avaldatud
competitions = [
  { id = 125, league = "Saalijalgpalli meistriliiga" },
]

[[source]]
name = "jaahoki_optibet"
sport = "jaahoki"
league = "Optibet Hokiliiga"
enabled = true
seasons = [["2026-09-05", "2027-04-15"]]

[[source]]
