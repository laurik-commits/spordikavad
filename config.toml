# spordikavad.ee seadistus

[site]
days_ahead = 14
# Lehe avalik aadress (kanoonilised lingid, sitemap). Muuda, kui spordikavad.ee domeen on seadistatud.
base_url = "https://laurik-commits.github.io/spordikavad/"
# Kontakt jaluses. Ajutiselt GitHubi issue'd, kuni omanik lisab e-posti (mailto:...).
contact_url = "https://github.com/laurik-commits/spordikavad/issues"
# Cloudflare Web Analytics (küpsisevaba). Vaikimisi välja lülitatud.
analytics_enabled = false
analytics_token = ""

[http]
# Kontaktaadress lisatakse User-Agenti, et allika omanik saaks vajadusel ühendust võtta.
# TODO: omanik lisab enne esimest päris kogumist oma kontaktaadressi.
contact = ""
user_agent = "spordikavad.ee-bot/0.1 (+https://spordikavad.ee)"
delay = 3.0       # sekundit päringute vahel samale saidile
timeout = 20.0
retries = 3

[http.host_delays]
"jalgpall.ee" = 5.0   # robots.txt: Crawl-Delay: 5

# Väline link ilma andmete kogumiseta (vt SOURCES.md, korvpall)
[[external_link]]
sport = "korvpall"
url = "https://www.basket.ee/et/ajakava-ja-tulemused?action=schedule"

# Allikad. Hooaja kuupäevad on ligikaudsed (vt SOURCES.md). Hooaja sees tähendab
# 0 mängu viga, väljaspool hooaega mitte.

[[source]]
name = "jalgpall_premiumliiga"
sport = "jalgpall"
league = "Premium liiga"
enabled = true
seasons = [["2027-03-01", "2027-11-30"]]

