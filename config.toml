# spordikavad.ee seadistus

[site]
days_ahead = 14
# Lehe avalik aadress (kanoonilised lingid, sitemap). Muuda, kui spordikavad.ee domeen on seadistatud.
base_url = "https://laurik-commits.github.io/spordikavad/"
# Kontakt jaluses. Ajutiselt GitHubi issue'd; kui info@spordikavad.ee postkast töötab,
# muuda: contact_url = "mailto:info@spordikavad.ee"
contact_url = "https://github.com/laurik-commits/spordikavad/issues"
# Cloudflare Web Analytics (küpsisevaba). Vaikimisi välja lülitatud.
analytics_enabled = false
analytics_token = ""

[http]
# Kontaktaadress lisatakse User-Agenti, et allika omanik saaks vajadusel ühendust võtta.
# Ajutiselt GitHubi issue'de leht; hiljem "info@spordikavad.ee", kui postkast töötab.
contact = "https://github.com/laurik-commits/spordikavad/issues"
# Kui domeen spordikavad.ee on kasutusel, vaheta URL siin ära.
user_agent = "spordikavad-bot/0.1 (+https://laurik-commits.github.io/spordikavad/)"
delay = 3.0       # sekundit päringute vahel samale saidile
timeout = 20.0
retries = 3

[http.host_delays]
"jalgpall.ee" = 5.0   # robots.txt: Crawl-Delay: 5
"bckalev.ee" = 5.0    # robots.txt-s crawl-delay'd pole; 1 päring päevas, viisakas 5 s
"basket.ut.ee" = 5.0  # robots.txt-s crawl-delay'd pole; 1 päring päevas, viisakas 5 s

# --- Linnad ja maakonnad (linnavalik) ---
# Suuremad linnad on valikus eraldi, ülejäänud kohad oma maakonna all ("Harjumaa (v.a Tallinn)").
# Iga venues.toml linn peab olema kas [[geo.city]], [geo.place] või geo.foreign all (test kontrollib).
# `in` = pealkirja vorm ("Spordimängud Tartus").

[geo]
default = "tallinn"
foreign = ["Cēsis", "Daugavpils", "Elektrėnai", "Jelgava", "Jēkabpils", "Kaunas", "Kocēni", "Liepāja",
