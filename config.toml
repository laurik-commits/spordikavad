link_text = "Eesti Jäähokiliit"

[[sport_note]]
sport = "korvpall"
note = "Näitame Bigbank/Kalevi mänge ja Tartu Ülikool Maks & Moorits kodumänge klubide kodulehtedelt. Korvpalliliidu leht ei luba andmete automaatset kogumist, seetõttu teiste klubide mänge siin pole."
url = "https://www.basket.ee/et/ajakava-ja-tulemused?action=schedule"
link_text = "Kõik mängud basket.ee lehel"

# Allikad. Hooaja kuupäevad on ligikaudsed (vt SOURCES.md). Hooaja sees tähendab
# 0 mängu viga, väljaspool hooaega mitte.

[[source]]
name = "jalgpall_ejl"
sport = "jalgpall"
league = "Jalgpall (EJL)"
enabled = true
seasons = [["03-01", "11-15"]]   # igal aastal: MM-DD
# jalgpall.ee liigade ID-d (/voistlused/<id>/liigad/calendar?season=<aasta>)
# check = false: karikad/playoffid, millel võib olla pikki pause (muidu: hooaja sees ≥1 mäng 42 päeva jooksul, vt build.py)
# level: 1 = kõrgliiga (vaikimisi), 2 = esiliiga (eraldi kalender „Esiliigad“, /esiliigad/…)
competitions = [
  { id = 52, league = "Premium liiga" },
  { id = 63, league = "Naiste meistriliiga" },
  { id = 53, league = "Esiliiga", level = 2 },
  { id = 186, league = "Esiliiga B", level = 2 },
  { id = 64, league = "Naiste esiliiga", level = 2 },
  # level = 3: madalamad liigad (eraldi kalender „Madalamad liigad“), samad ID-d igal aastal, season = aasta
  { id = 536, league = "II liiga", level = 3 },
  { id = 537, league = "II liiga B (Põhi/Lääne)", level = 3 },
  { id = 538, league = "II liiga B (Lõuna/Ida)", level = 3 },
  { id = 549, league = "III liiga (Põhi/Lääs)", level = 3 },
  { id = 548, league = "III liiga (Põhi/Ida)", level = 3 },
  { id = 550, league = "III liiga (Lõuna/Ida)", level = 3 },
  { id = 267, league = "IV liiga (Põhi/Ida)", level = 3 },
  { id = 268, league = "IV liiga (Põhi/Lääs)", level = 3 },
]

