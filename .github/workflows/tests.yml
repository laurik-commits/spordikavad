name: Testid

# Pull request'i kontroll enne merge'i (nt otsingu agendi kasitsi.toml lisandused).
# Ei kogu andmeid ega avalda lehte; ainult testid ja kasitsi.toml kontroll.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Sõltuvused
        run: pip install -r requirements.txt

      - name: Testid
        run: python -m unittest discover -s tests -t .

      - name: Käsitsi lisatud mängud (kasitsi.toml)
        run: python -m scrapers.kasitsi
