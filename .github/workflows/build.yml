name: Ehita ja avalda

on:
  schedule:
    # Cron on UTC-s: 03:00 UTC = 05:00 Tallinna talveajal, 06:00 suveajal
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # data/ kausta uuenduste commit
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Sõltuvused
        run: pip install -r requirements.txt

      - name: Testid
        run: python -m unittest discover -s tests -t .

      - name: Kogu andmed ja ehita leht
        run: python build.py

      - name: Salvesta uuendatud andmed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Andmed ei muutunud"
          else
            git commit -m "Andmete uuendus $(TZ=Europe/Tallinn date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
