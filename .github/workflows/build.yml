name: Ehita ja avalda

on:
  schedule:
    # Cron on UTC-s: 03:00 UTC = 05:00 Tallinna talveajal, 06:00 suveajal
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # data/ kausta uuenduste commit
  issues: write     # katkiste allikate teavitused
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Sõltuvused
        run: pip install -r requirements.txt

      - name: Testid
        run: python -m unittest discover -s tests -t .

      - name: Kogu andmed ja ehita leht
        run: python build.py

      - name: Teavita katkistest allikatest (GitHub Issues)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/report_issues.py

      - name: Salvesta uuendatud andmed
        # ei tohi avaldamist takistada (nt kui main on vahepeal liikunud)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ archive/ MAINTENANCE.md
          if git diff --cached --quiet; then
            echo "Andmed ei muutunud"
          else
            git commit -m "Andmete uuendus $(TZ=Europe/Tallinn date +%F)"
            git pull --rebase -X theirs origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # GitHub ei leia vahel äsja üles laaditud faili („No artifacts named github-pages“, juhtus 24.11 kaks korda).
      # Siis oota ja proovi samas käigus uuesti. Kui ka teine katse ebaõnnestub, jääb käik punaseks (e-kiri).
      # NB: ebaõnnestunud käigu „Re-run“ ei aita (siis on käigus 2 faili), käivita uus: gh workflow run build.yml
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Oota enne teist avaldamise katset
        if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
