<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lehte ei leitud | Ela kaasa</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="{{ base_path }}style.css">
<script>
// Vana kuupäevaleht (nt /tartu/2026-11-19/) → sama piirkonna tänane leht (/tartu/)
(function () {
  var base = "{{ base_path }}", p = location.pathname;
  // vanad aadressid (kuni 2026-11-23): Kogu Eesti oli /eesti/…, kõik liigad /koik/… → nüüd lehe juurkaustas
  var moved = p.replace(new RegExp("^" + base + "koik/"), base).replace(new RegExp("^" + base + "eesti/"), base);
  if (moved !== p) { location.replace(moved); return; }
  var m = p.match(/^(.*\/)\d{4}-\d{2}-\d{2}\/?(index\.html)?$/);
  if (m && m[1].indexOf(base) === 0) location.replace(m[1]);
  // vana jagatud mängu link (/m/<id>/, mäng on kalendrist juba väljas) → tänased mängud
  if (/\/m\/[0-9a-f]{12}\/?(index\.html)?$/.test(location.pathname)) location.replace("{{ base_path }}");
})();
</script>
</head>
<body>
<header class="bar"><div class="wrap"><div class="top"><a class="brand" href="{{ base_path }}">Elan kaasa</a></div></div></header>
<main class="wrap">
  <div class="none">
    <p>Seda lehte pole. Kui see oli möödunud päeva või mängu leht, on see juba eemaldatud.</p>
    <p><a href="{{ base_path }}">Vaata tänaseid mänge →</a></p>
  </div>
</main>
{% include "_analytics.html" %}
</body>
</html>
