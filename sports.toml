# Alade register: IGA ALA ON ÜKS [[sport]] plokk. Uue ala lisamiseks piisab siia ühest plokist (+ adapter/allikas).
# Sellest tulevad: SPORTS ja EVENT_SPORTS (scrapers/model.py), käänded, rühmad, allikate lingid ja „Meist“ tabeli
# märkused (build.py), värvid (style.css) ja nimed (kalender.js), Delfi/ERR kava ala tuvastus.
# Vt scrapers/sports.py ja tests/test_alad.py (kontrollib, et register on korras).
#
# Väljad:
#   key      võti (andmetes, URL-ides, CSS klassis)        name   nimi menüüs ja real
#   gen      ala omastav lauses „… {gen} mänge/võistlusi“   in     seesütlev: „Ela kaasa … {in} Tallinnas“
#   color    kellaploki taust (#rrggbb, valge tekst ≥ 4.5:1)
#   group    rühma võti [[group]]-ist (valikuline); gpos = koht rühmas (valikuline, muidu faili järjekord)
#   event    true = üritus (home = ürituse nimi, away tühi), mitte kahe võistkonna mäng
#   block    nimi värvilises kellaplokis pehmete sidekriipsudega (valikuline)
#   delfi    Delfi TV kava „label“ väärtused (väiketähtedega), go3 = Go3 kava žanrid (väiketähtedega),
#   err      ERR kava nime alguse regex (kõik valikulised)
#   sources  allikate avalehed „Meist“ lehe jaoks [{name, url}]   manual = „Meist“ tabeli käsitsi kaetud osa
# Faili järjekord = alade järjekord lehel.

