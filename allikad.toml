# Allikate register: kust leiab infot Eestis toimuvate spordimängude kohta.
#
# Otsingu agent käib iga jooksuga läbi kõik kirjed, mille kasutus on "agent" (kohustuslik) või
# "vihje" (vihjed, mille põhjal otsitakse ametlik kinnitus). Kirjed kasutusega "adapter:<nimi>"
# loetakse automaatselt iga päev (scrapers/<nimi>.py), neid agent üle ei käi.
# "keelatud" = kasutustingimused või robots.txt ei luba lugeda, ära kasuta.
#
# Väljad:
#   nimi          allika nimi
#   liik          hall | linn | liit | klubi | rahvusvaheline | pilet | uudised
#   url           leht, kust mänge/üritusi leiab (kalender, ajakava, sündmuste leht)
#   alad          ["kõik"] või alade võtmed scrapers/model.py SPORTS-ist (jalgpall, korvpall, …, voitlusspordid, autosport)
#   piirkond      linn, maakond, "Eesti" või "rahvusvaheline"
#   kuju          html (sisu on lehel tekstina) | js (laaditakse JavaScriptiga) | api | pdf
#   robots        lubatud | keelatud | puudub (robots.txt puudub) | kontrollimata
#   kasutus       adapter:<nimi> | agent | vihje | keelatud
#   kontrollitud  millal viimati kontrolliti (kuupäev)
#   kandidaat     valikuline, true = korrapärane mängukava, sobiks automaatseks adapteriks
#   markus        valikuline märkus: mida sealt leiab, mis on keeruline
#
# Kontroll:  python allikad.py   (loetelu ja vead)   python allikad.py --agent   (agendi kontrollnimekiri)

