# Meeskonnanimede aliased (vt analuus/meeskonnad.py). Suur-/väiketähed, kirjavahemärgid ja täpitähed ühtlustatakse ise
# („Barrus/Võru VK“ = „BARRUS/Võru VK“ = „Barrus Võru VK“), siia tulevad ainult erinevad nimed, mis on SAMA meeskond.
# Noorte- ja teise võistkonna nimed (U-20, II, (13)) on tahtlikult eraldi meeskonnad: ära liida neid põhimeeskonnaga.
# Kandidaadid ülevaatuseks:  python -m analuus.meeskonnad   (kontrollimata ei liida: nt „Sparta“ ~ „Sparta Team Automaailm“,
# „Pärnu SK/VK“ ~ „PÄRNU VK“, „Audentese SG“ ~ „Audentese SG / NT“).

